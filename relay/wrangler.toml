# Relay für Online-Spiele außerhalb des Claude-Artefakts (itch.io). Deploy: im Ordner relay/ "npx wrangler deploy" (Cloudflare-Account von Silas)
name = "kritzelschlacht-relay"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

# Free-Plan: Durable Objects nur mit SQLite-Speicher (new_sqlite_classes)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Store"]
