<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kritzelschlacht</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-bleed white battlefield; all UI floats as soft white pills along the edges */
:root{
  --field:#ffffff;
  --ink:#2a2a33;
  --muted:#868b98;
  --line:#e4e6ee;
  --pill:#ffffff;
  --soft:#f3f4f8;
  --sel:#eaf1ff;
  --selb:#4d82f0;
  --go:#ff7a3d;
  --gold:#ffb800;
  --f-logo:'Luckiest Guy','Arial Black',Impact,system-ui,sans-serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--field);color:var(--ink);font-family:var(--f-ui);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--field)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--selb);outline-offset:2px}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p{pointer-events:auto}
.shadow{background:var(--pill);border:1px solid var(--line);box-shadow:0 4px 18px rgba(30,35,60,.08)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-logo);font-size:clamp(22px,3.2vw,34px);line-height:1;color:#fff;letter-spacing:1px;
  -webkit-text-stroke:1.6px var(--ink);paint-order:stroke fill;text-shadow:2px 3px 0 var(--ink);transform:rotate(-2deg);user-select:none;white-space:nowrap}
.logo span{color:var(--go)}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.icons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:13px;font-weight:800}
.ib svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--sel);border-color:var(--selb)}
.ib.txt{width:auto;padding:0 12px;border-radius:999px}

.misbar{align-self:center;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:16px;flex-wrap:wrap;justify-content:center;max-width:100%}
.misbar .mt{display:flex;flex-direction:column;min-width:0}
.misbar .mn{font-size:15px;font-weight:800}
.misbar .mh{font-size:12.5px;color:var(--muted);font-weight:700;max-width:46ch}
.budget{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.bbar{width:110px;height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bbar i{display:block;height:100%;width:0;background:var(--selb);border-radius:99px;transition:width .15s}
.bbar i.over{background:#e5574f}
.go{background:var(--go);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-family:var(--f-logo);font-size:18px;letter-spacing:1px;box-shadow:0 3px 0 #c4541f}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #c4541f}
.go:disabled{opacity:.45;cursor:default}

.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.counts{border-radius:14px;padding:8px 12px;min-width:150px;max-height:40vh;overflow:auto;font-size:13.5px}
.counts .row{display:flex;align-items:center;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.counts img{width:22px;height:22px}
.counts .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.counts b{min-width:28px;text-align:right}
.counts span{color:var(--muted)}
.counts .empty{color:var(--muted);font-size:12.5px}

.palette{border-radius:16px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.info{font-size:12.5px;color:var(--muted);padding:2px 6px 0;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{color:var(--ink)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:9px;padding:5px 11px;color:var(--muted);font-weight:800;font-size:14px}
.tabs button.on{background:var(--soft);color:var(--ink)}
.tabs button:disabled{opacity:.35;cursor:default}
.units{display:flex;gap:5px;overflow-x:auto;padding:2px;scrollbar-width:thin}
.ub{flex:0 0 auto;width:58px;height:54px;border-radius:11px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;position:relative}
.ub img{width:40px;height:40px;pointer-events:none}
.ub small{position:absolute;right:3px;bottom:1px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ub.on{background:var(--sel);border-color:var(--selb)}
.brushrow{display:flex;align-items:center;gap:8px;padding:2px 6px 0}
.brush{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.brush input{flex:1;accent-color:var(--selb);min-width:80px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.mini:hover{border-color:var(--ink)}
.keys{font-size:11px;color:var(--muted);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts .pw{flex:1;height:5px;border-radius:9px;min-width:30px;max-width:70px;background:var(--soft);overflow:hidden;margin-left:auto}
.counts .pw u{display:block;height:100%;border-radius:9px}
@media (hover:none){.keys{display:none}}

.teams{border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked + .tr{background:var(--selb)}
.switch input:checked + .tr::after{left:16px}
.switch input:focus-visible + .tr{outline:3px solid var(--selb);outline-offset:2px}
.chips{display:flex;gap:6px}
.chip{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);padding:0}
.chip.on{box-shadow:0 0 0 2.5px var(--ink)}

.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);pointer-events:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{border-radius:20px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.card.wide{max-width:720px}
.card h2{font-family:var(--f-logo);font-weight:400;font-size:34px;letter-spacing:1px;margin:0;line-height:1.05;color:#fff;-webkit-text-stroke:1.4px var(--ink);paint-order:stroke fill;text-shadow:2px 3px 0 var(--ink);text-wrap:balance}
.card h2.win{color:var(--gold)}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.stars{display:flex;gap:6px;font-size:38px;line-height:1}
.stars i{font-style:normal;color:var(--line);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.stars i.on{color:var(--gold);animation:stamp .4s cubic-bezier(.3,1.8,.5,1) both}
.stars i.on:nth-child(2){animation-delay:.18s}.stars i.on:nth-child(3){animation-delay:.36s}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.stats{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14.5px;font-variant-numeric:tabular-nums}
.stats li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:3px 0}
.stats li span{color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:800;font-size:14.5px}
.btn:hover{border-color:var(--ink)}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lv{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.lv:hover:not(:disabled){border-color:var(--ink)}
.lv:disabled{opacity:.45;cursor:default}
.lv .no{font-size:12px;color:var(--muted)}
.lv .nm{font-size:15px;font-weight:800}
.lv .st{color:var(--gold);font-size:16px;letter-spacing:2px;-webkit-text-stroke:.6px var(--ink)}
.lv .st em{color:var(--line);font-style:normal}

.banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;font-family:var(--f-logo);font-size:clamp(30px,6vw,64px);color:var(--gold);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink);animation:pop .5s cubic-bezier(.3,1.7,.5,1) both;padding:0 16px}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

@media (max-width:820px){
  .palette{order:3;width:100%}
  .counts{min-width:0;font-size:12.5px;max-height:22vh}
  .misbar .mh{display:none}
  .toast{bottom:190px}
}
@media (prefers-reduced-motion:reduce){
  .banner,.stars i.on{animation:none}
}
.fps{position:absolute;left:8px;top:8px;z-index:5;background:var(--ink);color:#fff;font:800 12px/1 var(--f-ui);padding:5px 8px;border-radius:8px;pointer-events:none;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Schlachtfeld: hier Einheiten malen"></canvas>
  <div class="hud">
    <div class="top">
      <div class="logo" aria-label="Kritzelschlacht">Kritzel<span>schlacht</span></div>
      <div class="seg shadow p" role="tablist" aria-label="Modus">
        <button id="mSand" class="on" role="tab">Sandkasten</button>
        <button id="mMis" role="tab">Missionen</button>
      </div>
      <div class="icons p">
        <button class="ib shadow" id="bDice" title="Zufallsschlacht" aria-label="Zufallsschlacht"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg></button>
        <button class="ib shadow txt" id="bSpeed" title="Tempo">1×</button>
        <button class="ib shadow" id="bSlow" title="Zeitlupe" aria-label="Zeitlupe"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></button>
        <button class="ib shadow" id="bPause" title="Pause (P)" aria-label="Pause"><svg viewBox="0 0 24 24" id="pauseIco"><path d="M9 5v14M15 5v14"/></svg></button>
        <button class="ib shadow" id="bMute" title="Ton" aria-label="Ton an oder aus"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
        <button class="ib shadow" id="bClear" title="Alles leeren" aria-label="Alles leeren"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
    </div>

    <div class="misbar shadow p" id="misBar" hidden>
      <div class="mt"><div class="mn" id="misName"></div><div class="mh" id="misHint"></div></div>
      <div class="budget"><div class="bbar"><i id="budFill"></i></div><span id="budTxt"></span></div>
      <button class="btn" id="misList">Übersicht</button>
      <button class="go" id="misGo">Los!</button>
    </div>

    <div style="flex:1"></div>

    <div class="bottom">
      <div class="counts shadow p" id="counts" aria-live="polite"></div>
      <div class="palette shadow p">
        <div class="info" id="info"></div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Kategorie"></div>
        <div class="units" id="units"></div>
        <div class="brushrow">
          <label class="brush" for="brush">Pinsel <input type="range" id="brush" min="10" max="150" value="48"></label>
          <button class="mini" id="bUndo" title="Letzten Pinselstrich zurücknehmen (Strg+Z)">↶ Rückgängig</button>
        </div>
        <div class="keys">Tasten: 1–9 Einheit · Q/E Kategorie · X Radierer · +/− Pinsel · Strg+Z zurück · P Pause · Mausrad Zoom · Leertaste+Ziehen verschieben</div>
      </div>
      <div class="teams shadow p" id="teamBox">
        <label class="switch"><input type="checkbox" id="teamToggle"><span class="tr"></span>Teamkampf</label>
        <div class="chips" id="chips" hidden></div>
      </div>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <div class="ov" id="ovRes" hidden>
    <div class="card shadow">
      <h2 id="resTitle">Sieg!</h2>
      <div class="stars" id="resStars"></div>
      <ul class="stats" id="resStats"></ul>
      <div class="btnrow">
        <button class="go" id="resNext">Nächste Mission</button>
        <button class="btn" id="resRetry">Nochmal planen</button>
        <button class="btn" id="resList">Übersicht</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovList" hidden>
    <div class="card wide shadow">
      <h2>Missionen</h2>
      <p>Jede Mission gibt dir ein Punktebudget. Gewinne mit möglichst wenig Punkten für drei Sterne.</p>
      <div class="lvgrid" id="lvGrid"></div>
      <div class="btnrow"><button class="btn" id="listClose">Zurück zum Sandkasten</button></div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
