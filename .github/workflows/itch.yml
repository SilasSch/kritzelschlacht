name: itch.io
# Prüft den Relay und baut das HTML5-ZIP für itch.io (tools/itch-zip.py) und hängt es als Artefakt an den Lauf.
# Auf master lädt butler das ZIP nach https://slilok.itch.io/kritzelschlacht hoch (Kanal html5), sofern das Secret
# BUTLER_API_KEY gesetzt ist (Silas, 25.11.). Ohne Secret: ZIP aus dem Lauf herunterladen und von Hand hochladen.
on:
  push:
    paths: ['game/**', 'relay/**', 'tools/itch-zip.py', 'tools/relay-smoke.mjs', '.github/workflows/itch.yml']
  workflow_dispatch:
jobs:
  zip:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Relay erreichbar?
        run: node tools/relay-smoke.mjs "$(python3 -c "import re;print(re.search(r\"^RELAY = '(.*)'\", open('tools/itch-zip.py').read(), re.M).group(1))")"
      - run: python3 tools/itch-zip.py "" dist/kritzelschlacht-itch.zip
      - uses: actions/upload-artifact@v4
        with:
          name: kritzelschlacht-itch
          path: dist/kritzelschlacht-itch.zip
      - name: Upload zu itch.io (butler)
        if: ${{ github.ref == 'refs/heads/master' && env.BUTLER_API_KEY != '' }}
        run: |
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push dist/kritzelschlacht-itch.zip slilok/kritzelschlacht:html5 --userversion "${GITHUB_SHA::7}"
