<title>Kritzelschlacht</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: full-bleed white battlefield; all UI floats as soft white pills along the edges */
:root{
  --field:#ffffff;
  --ink:#2a2a33;
  --muted:#868b98;
  --line:#e4e6ee;
  --pill:#ffffff;
  --soft:#f3f4f8;
  --sel:#eaf1ff;
  --selb:#4d82f0;
  --go:#ff7a3d;
  --gold:#ffb800;
  --f-logo:'Luckiest Guy','Arial Black',Impact,system-ui,sans-serif;
  --f-ui:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--field);color:var(--ink);font-family:var(--f-ui);font-weight:700;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;overflow:hidden;background:var(--field)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--selb);outline-offset:2px}

.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;gap:10px;
  padding-top:max(12px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.p{pointer-events:auto}
.shadow{background:var(--pill);border:1px solid var(--line);box-shadow:0 4px 18px rgba(30,35,60,.08)}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo{font-family:var(--f-logo);font-size:clamp(22px,3.2vw,34px);line-height:1;color:#fff;letter-spacing:1px;
  -webkit-text-stroke:1.6px var(--ink);paint-order:stroke fill;text-shadow:2px 3px 0 var(--ink);transform:rotate(-2deg);user-select:none;white-space:nowrap}
.logo span{color:var(--go)}
.seg{display:flex;gap:2px;padding:4px;border-radius:999px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:800;font-size:14px}
.seg button.on{background:var(--ink);color:#fff}
.icons{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;font-size:13px;font-weight:800}
.ib svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{background:var(--sel);border-color:var(--selb)}
.ib.txt{width:auto;padding:0 12px;border-radius:999px}

.misbar{align-self:center;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:16px;flex-wrap:wrap;justify-content:center;max-width:100%}
.misbar .mt{display:flex;flex-direction:column;min-width:0}
.misbar .mn{font-size:15px;font-weight:800}
.misbar .mh{font-size:12.5px;color:var(--muted);font-weight:700;max-width:46ch}
.budget{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap}
.bbar{width:110px;height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bbar i{display:block;height:100%;width:0;background:var(--selb);border-radius:99px;transition:width .15s}
.bbar i.over{background:#e5574f}
.go{background:var(--go);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-family:var(--f-logo);font-size:18px;letter-spacing:1px;box-shadow:0 3px 0 #c4541f}
.go:active{transform:translateY(2px);box-shadow:0 1px 0 #c4541f}
.go:disabled{opacity:.45;cursor:default}

.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.counts{border-radius:14px;padding:8px 12px;min-width:150px;max-height:40vh;overflow:auto;font-size:13.5px}
.counts .row{display:flex;align-items:center;gap:8px;padding:2px 0;font-variant-numeric:tabular-nums}
.counts img{width:22px;height:22px}
.counts .dot{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink)}
.counts b{min-width:28px;text-align:right}
.counts span{color:var(--muted)}
.counts .empty{color:var(--muted);font-size:12.5px}

.palette{border-radius:16px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:4px;min-width:0;max-width:100%}
.info{font-size:12.5px;color:var(--muted);padding:2px 6px 0;min-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info b{color:var(--ink)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;border-radius:9px;padding:5px 11px;color:var(--muted);font-weight:800;font-size:14px}
.tabs button.on{background:var(--soft);color:var(--ink)}
.tabs button:disabled{opacity:.35;cursor:default}
.units{display:flex;gap:5px;overflow-x:auto;padding:2px;scrollbar-width:thin}
.ub{flex:0 0 auto;width:58px;height:54px;border-radius:11px;border:1.5px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2px;position:relative}
.ub img{width:40px;height:40px;pointer-events:none}
.ub small{position:absolute;right:3px;bottom:1px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.ub.on{background:var(--sel);border-color:var(--selb)}
.brushrow{display:flex;align-items:center;gap:8px;padding:2px 6px 0}
.brush{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);flex:1;min-width:0}
.brush input{flex:1;accent-color:var(--selb);min-width:80px}
.mini{border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.mini:hover{border-color:var(--ink)}
.keys{font-size:11px;color:var(--muted);padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.counts .pw{flex:1;height:5px;border-radius:9px;min-width:30px;max-width:70px;background:var(--soft);overflow:hidden;margin-left:auto}
.counts .pw u{display:block;height:100%;border-radius:9px}
@media (hover:none){.keys{display:none}}

.teams{border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.switch{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .15s}
.switch .tr::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.switch input:checked + .tr{background:var(--selb)}
.switch input:checked + .tr::after{left:16px}
.switch input:focus-visible + .tr{outline:3px solid var(--selb);outline-offset:2px}
.chips{display:flex;gap:6px}
.chip{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);padding:0}
.chip.on{box-shadow:0 0 0 2.5px var(--ink)}

.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);pointer-events:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.card{border-radius:20px;padding:22px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.card.wide{max-width:720px}
.card h2{font-family:var(--f-logo);font-weight:400;font-size:34px;letter-spacing:1px;margin:0;line-height:1.05;color:#fff;-webkit-text-stroke:1.4px var(--ink);paint-order:stroke fill;text-shadow:2px 3px 0 var(--ink);text-wrap:balance}
.card h2.win{color:var(--gold)}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.45}
.stars{display:flex;gap:6px;font-size:38px;line-height:1}
.stars i{font-style:normal;color:var(--line);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.stars i.on{color:var(--gold);animation:stamp .4s cubic-bezier(.3,1.8,.5,1) both}
.stars i.on:nth-child(2){animation-delay:.18s}.stars i.on:nth-child(3){animation-delay:.36s}
@keyframes stamp{from{transform:scale(2.2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.stats{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14.5px;font-variant-numeric:tabular-nums}
.stats li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:3px 0}
.stats li span{color:var(--muted)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:800;font-size:14.5px}
.btn:hover{border-color:var(--ink)}
.lvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lv{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.lv:hover:not(:disabled){border-color:var(--ink)}
.lv:disabled{opacity:.45;cursor:default}
.lv .no{font-size:12px;color:var(--muted)}
.lv .nm{font-size:15px;font-weight:800}
.lv .st{color:var(--gold);font-size:16px;letter-spacing:2px;-webkit-text-stroke:.6px var(--ink)}
.lv .st em{color:var(--line);font-style:normal}

.banner{position:absolute;left:0;right:0;top:22%;text-align:center;pointer-events:none;font-family:var(--f-logo);font-size:clamp(30px,6vw,64px);color:var(--gold);
  -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 4px 0 var(--ink);animation:pop .5s cubic-bezier(.3,1.7,.5,1) both;padding:0 16px}
@keyframes pop{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.toast{position:absolute;left:50%;bottom:150px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;pointer-events:none;max-width:calc(100% - 32px);text-align:center}

@media (max-width:820px){
  .palette{order:3;width:100%}
  .counts{min-width:0;font-size:12.5px;max-height:22vh}
  .misbar .mh{display:none}
  .toast{bottom:190px}
}
@media (prefers-reduced-motion:reduce){
  .banner,.stars i.on{animation:none}
}
</style>

<div id="app">
  <canvas id="cv" aria-label="Schlachtfeld: hier Einheiten malen"></canvas>
  <div class="hud">
    <div class="top">
      <div class="logo" aria-label="Kritzelschlacht">Kritzel<span>schlacht</span></div>
      <div class="seg shadow p" role="tablist" aria-label="Modus">
        <button id="mSand" class="on" role="tab">Sandkasten</button>
        <button id="mMis" role="tab">Missionen</button>
      </div>
      <div class="icons p">
        <button class="ib shadow" id="bDice" title="Zufallsschlacht" aria-label="Zufallsschlacht"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><circle cx="9" cy="9" r="1.2" fill="currentColor"/><circle cx="15" cy="15" r="1.2" fill="currentColor"/><circle cx="15" cy="9" r="1.2" fill="currentColor"/><circle cx="9" cy="15" r="1.2" fill="currentColor"/></svg></button>
        <button class="ib shadow txt" id="bSpeed" title="Tempo">1×</button>
        <button class="ib shadow" id="bSlow" title="Zeitlupe" aria-label="Zeitlupe"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg></button>
        <button class="ib shadow" id="bPause" title="Pause (Leertaste)" aria-label="Pause"><svg viewBox="0 0 24 24" id="pauseIco"><path d="M9 5v14M15 5v14"/></svg></button>
        <button class="ib shadow" id="bMute" title="Ton" aria-label="Ton an oder aus"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
        <button class="ib shadow" id="bClear" title="Alles leeren" aria-label="Alles leeren"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
    </div>

    <div class="misbar shadow p" id="misBar" hidden>
      <div class="mt"><div class="mn" id="misName"></div><div class="mh" id="misHint"></div></div>
      <div class="budget"><div class="bbar"><i id="budFill"></i></div><span id="budTxt"></span></div>
      <button class="btn" id="misList">Übersicht</button>
      <button class="go" id="misGo">Los!</button>
    </div>

    <div style="flex:1"></div>

    <div class="bottom">
      <div class="counts shadow p" id="counts" aria-live="polite"></div>
      <div class="palette shadow p">
        <div class="info" id="info"></div>
        <div class="tabs" id="tabs" role="tablist" aria-label="Kategorie"></div>
        <div class="units" id="units"></div>
        <div class="brushrow">
          <label class="brush" for="brush">Pinsel <input type="range" id="brush" min="10" max="150" value="48"></label>
          <button class="mini" id="bUndo" title="Letzten Pinselstrich zurücknehmen (Strg+Z)">↶ Rückgängig</button>
        </div>
        <div class="keys">Tasten: 1–7 Einheit · Q/E Kategorie · X Radierer · Strg+Z zurück · Leertaste Pause</div>
      </div>
      <div class="teams shadow p" id="teamBox">
        <label class="switch"><input type="checkbox" id="teamToggle"><span class="tr"></span>Teamkampf</label>
        <div class="chips" id="chips" hidden></div>
      </div>
    </div>
  </div>

  <div class="banner" id="banner" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <div class="ov" id="ovRes" hidden>
    <div class="card shadow">
      <h2 id="resTitle">Sieg!</h2>
      <div class="stars" id="resStars"></div>
      <ul class="stats" id="resStats"></ul>
      <div class="btnrow">
        <button class="go" id="resNext">Nächste Mission</button>
        <button class="btn" id="resRetry">Nochmal planen</button>
        <button class="btn" id="resList">Übersicht</button>
      </div>
    </div>
  </div>

  <div class="ov" id="ovList" hidden>
    <div class="card wide shadow">
      <h2>Missionen</h2>
      <p>Jede Mission gibt dir ein Punktebudget. Gewinne mit möglichst wenig Punkten für drei Sterne.</p>
      <div class="lvgrid" id="lvGrid"></div>
      <div class="btnrow"><button class="btn" id="listClose">Zurück zum Sandkasten</button></div>
    </div>
  </div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const O='#2a2a33';
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Daten ---------- */
const U={
  krieger:{n:'Krieger',cat:'armee',col:'#5b8def',r:9,hp:60,dmg:12,range:3,speed:52,cd:.8,cost:2,d:'Marschiert in Reihe und umzingelt Gegner. Treffer von hinten machen +35 %.'},
  schuetze:{n:'Schütze',cat:'armee',col:'#6cc067',r:9,hp:40,dmg:12,range:210,speed:44,cd:1.2,cost:2.5,d:'Schießt Pfeile und weicht Nahkämpfern aus.'},
  ritter:{n:'Ritter',cat:'armee',col:'#b4bcc8',r:11,hp:200,dmg:15,range:3,speed:34,cd:1,cost:4.5,d:'Ab 3 Rittern Schildwall: kaum Schaden durch Pfeile und Schwerter. Anfällig für Bomben und Feuer.'},
  grenadier:{n:'Grenadier',cat:'armee',col:'#e5574f',r:9,hp:45,dmg:20,range:170,splash:42,speed:44,cd:2.8,cost:4,d:'Wirft Bomben. Sprengt auch Mauern.'},
  reiter:{n:'Reiter',cat:'armee',col:'#d9a35b',r:13,hp:120,dmg:17,range:4,speed:115,cd:1.1,cost:3,d:'Reitet über die Flanke an, stürmt durch die Reihen und wendet.'},
  sani:{n:'Sanitäter',cat:'armee',col:'#f4f4f6',r:9,hp:40,heal:10,range:90,speed:50,cd:1,cost:3,d:'Heilt Verbündete und hält sich aus dem Getümmel heraus.'},
  wolf:{n:'Wolf',cat:'tiere',col:'#8d939e',r:8,hp:40,dmg:7,range:3,speed:100,cd:.55,cost:1.5,d:'Jagt im Rudel: kreist die Beute ein und beißt von der Seite.'},
  baer:{n:'Bär',cat:'tiere',col:'#8b5a3c',r:16,hp:280,dmg:24,range:4,splash:26,speed:46,cd:1.4,cost:10,d:'Sehr zäh. Prankenhiebe treffen mehrere.'},
  biene:{n:'Bienen',cat:'tiere',col:'#f5c518',r:4,hp:7,dmg:3,range:2,speed:125,cd:.45,cost:0.5,fly:1,d:'Schwirrender Schwarm, der sein Ziel umkreist. Billig und lästig.'},
  magier:{n:'Magier',cat:'mythisch',col:'#9b6be0',r:9,hp:50,dmg:20,range:230,splash:38,speed:40,cd:2.6,cost:5,d:'Feuerbälle mit Flächenschaden.'},
  geist:{n:'Geist',cat:'mythisch',col:'#eef3fa',r:10,hp:55,dmg:7,range:3,speed:62,cd:.7,cost:3,fly:1,d:'Schwebt über alles und jagt Schützen, Magier und Sanitäter. Nur Feuer trifft voll.'},
  drache:{n:'Drache',cat:'mythisch',col:'#2fae8f',r:26,hp:900,dmg:6,range:110,speed:48,cd:.2,cost:40,fly:1,d:'Kreist über dem Ziel und speit Feuer in einem Kegel.'},
  soldat:{n:'Soldat',cat:'modern',col:'#7f8f4f',r:9,hp:55,dmg:9,range:190,speed:50,cd:.9,cost:3,d:'Sturmgewehr auf mittlere Distanz. Weicht Nahkämpfern aus.'},
  mg:{n:'MG-Schütze',cat:'modern',col:'#c2a66b',r:10,hp:80,dmg:3.5,range:170,speed:36,cd:.15,cost:4.5,d:'Dauerfeuer. Mäht Schwärme und Infanterie, aber langsam.'},
  sniper:{n:'Scharfschütze',cat:'modern',col:'#4f6b3a',r:9,hp:40,dmg:60,range:380,speed:40,cd:3.2,cost:7,d:'Riesige Reichweite, ein Schuss, ein Treffer. Sehr verwundbar.'},
  panzerfaust:{n:'Panzerfaust',cat:'modern',col:'#b59060',r:9,hp:60,dmg:70,range:230,splash:22,speed:44,cd:4,cost:6,d:'Rakete gegen Panzer und Hubschrauber. Lange Nachladezeit.'},
  moerser:{n:'Mörser',cat:'modern',col:'#8a8f5a',r:9,hp:40,dmg:40,range:420,splash:55,speed:34,cd:4.5,cost:9,d:'Indirektes Feuer über Mauern hinweg. Hilflos im Nahkampf.'},
  panzer:{n:'Panzer',cat:'modern',col:'#6b7b45',r:22,hp:1000,dmg:45,range:260,splash:30,speed:32,cd:3,cost:35,d:'Kugeln, Pfeile und Schwerter prallen ab. Kanone mit Flächenschaden. Schwach gegen Raketen.'},
  heli:{n:'Hubschrauber',cat:'modern',col:'#7b8a78',r:18,hp:340,dmg:4,range:200,speed:85,cd:.2,cost:18,fly:1,d:'Fliegt, kreist und feuert Salven. Nahkämpfer kommen nicht ran, Raketen schon.'},
};
const TER={
  wasser:{n:'Wasser',id:1,cost:.04,d:'Bremst Bodentruppen auf 40 % Tempo.'},
  lava:{n:'Lava',id:2,cost:.12,d:'Verbrennt alles, was nicht fliegt.'},
  wald:{n:'Wald',id:3,cost:.04,d:'Deckung: halber Schaden durch Pfeile und Explosionen.'},
  mauer:{n:'Mauer',id:4,cost:.1,d:'Blockiert Bodentruppen, bis sie zerschlagen wird.'},
  radierer:{n:'Radierer',id:0,cost:0,d:'Entfernt Einheiten und Gelände unter dem Pinsel.'},
};
const PL={krieger:'Krieger',schuetze:'Schützen',ritter:'Ritter',grenadier:'Grenadiere',reiter:'Reiter',sani:'Sanitäter',wolf:'Wölfe',baer:'Bären',biene:'Bienen',magier:'Magier',geist:'Geister',drache:'Drachen',soldat:'Soldaten',mg:'MG-Schützen',sniper:'Scharfschützen',panzerfaust:'Panzerfäuste',moerser:'Mörser',panzer:'Panzer',heli:'Hubschrauber'};
const CATS=[['armee','Armee'],['tiere','Tiere'],['mythisch','Mythisch'],['modern','Modern'],['gelaende','Gelände']];
const TEAMS={blau:{n:'Blau',c:'#3f7cff',body:'#5b8def'},rot:{n:'Rot',c:'#ff4d4d',body:'#ef5d55'},gruen:{n:'Grün',c:'#2fbf6b',body:'#4fc07a'},gelb:{n:'Gelb',c:'#ffb800',body:'#ffc533'}};
const CELL=10, HC=40, STEP=1/60;

/* ---------- Speicher ---------- */
const SKEY='kritzelschlacht-v1';
let save={stars:{},muted:false};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'null');if(s&&typeof s==='object')save=Object.assign(save,s);if(!save.stars)save.stars={};}catch(e){}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}

/* ---------- Zustand ---------- */
const cv=$('cv'),ctx=cv.getContext('2d');
let W=1400,H=800,zoom=1,dpr=1;
let GW=0,GH=0,terr=new Uint8Array(0),towner=new Uint8Array(0),whp=new Float32Array(0);

    if(t==='radierer'){x.translate(48,50);x.rotate(-.6);x.fillStyle='#ff9fb3';x.strokeStyle=O;x.lineWidth=3;x.beginPath();if(x.roundRect)x.roundRect(-30,-16,60,32,7);else x.rect(-30,-16,60,32);x.fill();x.stroke();x.fillStyle='#7aa7ff';x.fillRect(6,-14.5,22,29);x.beginPath();x.moveTo(6,-16);x.lineTo(6,16);x.stroke();}

}

/* ---------- Welt & Größe ---------- */
function resize(){
  const br=cv.getBoundingClientRect(),sw=Math.max(280,br.width||innerWidth),sh=Math.max(280,br.height||innerHeight);
  zoom=clamp(Math.min(sw/1400,sh/820),.55,1.15);
  dpr=Math.min(2,devicePixelRatio||1);
  cv.width=Math.round(sw*dpr);cv.height=Math.round(sh*dpr);
  const nGW=Math.ceil(sw/zoom/CELL),nGH=Math.ceil(sh/zoom/CELL);
  W=sw/zoom;H=sh/zoom;
  setTerrain({GW,GH,terr,towner,whp},nGW,nGH);
  HW=Math.ceil(W/HC)+1;HH=Math.ceil(H/HC)+1;hash=Array.from({length:HW*HH},()=>[]);
  tcv.width=Math.ceil(W*zoom*dpr);tcv.height=Math.ceil(H*zoom*dpr);
  dcv.width=tcv.width;dcv.height=tcv.height;undoStack.length=0;
  sprites.clear();
  for(const u of units){u.x=clamp(u.x,6,W-6);u.y=clamp(u.y,6,H-6);}
  drawTerrain(0,0,GW-1,GH-1);
}
function setTerrain(src,nGW,nGH){
  const t=new Uint8Array(nGW*nGH),o=new Uint8Array(nGW*nGH),h=new Float32Array(nGW*nGH);
  if(src&&src.terr&&src.terr.length){const mw=Math.min(nGW,src.GW),mh=Math.min(nGH,src.GH);
    for(let y=0;y<mh;y++)for(let x=0;x<mw;x++){const a=y*src.GW+x,b2=y*nGW+x;t[b2]=src.terr[a];o[b2]=src.towner[a];h[b2]=src.whp[a];}}
  GW=nGW;GH=nGH;terr=t;towner=o;whp=h;
}
const cIdx=(x,y)=>clamp(y/CELL|0,0,GH-1)*GW+clamp(x/CELL|0,0,GW-1);

function drawTerrain(x0,y0,x1,y1){
  x0=clamp(x0,0,GW-1);x1=clamp(x1,0,GW-1);y0=clamp(y0,0,GH-1);y1=clamp(y1,0,GH-1);
  const k=zoom*dpr,c=tctx;c.save();c.setTransform(k,0,0,k,0,0);
  const px0=x0*CELL,py0=y0*CELL,pw=(x1-x0+1)*CELL,ph=(y1-y0+1)*CELL;
  c.beginPath();c.rect(px0,py0,pw,ph);c.clip();c.clearRect(px0,py0,pw,ph);
  const ax0=Math.max(0,x0-2),ax1=Math.min(GW-1,x1+2),ay0=Math.max(0,y0-2),ay1=Math.min(GH-1,y1+2);
  const layers=[[1,9.5,'#a8e6f0'],[1,7,'#62b9ea'],[2,9.5,'#ffb54d'],[2,7,'#f2652f'],[3,9,'#b5dfae'],[4,8.6,'#5b5f69'],[4,7.3,'#a3a8b2']];
  for(const[id,rad,col]of layers){
    c.fillStyle=col;c.beginPath();let any=false;
    for(let gy=ay0;gy<=ay1;gy++)for(let gx=ax0;gx<=ax1;gx++){if(terr[gy*GW+gx]!==id)continue;const cx=gx*CELL+5,cy=gy*CELL+5;c.moveTo(cx+rad,cy);c.arc(cx,cy,rad,0,6.2832);any=true;}
    if(any)c.fill();
  }
  for(let gy=ay0;gy<=ay1;gy++)for(let gx=ax0;gx<=ax1;gx++){
    const i=gy*GW+gx,t=terr[i];if(!t)continue;const cx=gx*CELL+5,cy=gy*CELL+5,h=hh(gx,gy);
    if(t===1&&h<.05){c.fillStyle='rgba(60,150,215,.35)';c.beginPath();c.ellipse(cx,cy,14,9,0,0,7);c.fill();}
    if(t===2&&h<.1){c.fillStyle='#ffd36b';c.beginPath();c.arc(cx,cy,2.4,0,7);c.fill();}
    if(t===3&&h<.16){E(c,cx,cy,8.5,8,'#4e9f5d',1.6,'#2f6b3b');E(c,cx-2.5,cy-2.5,3,2.6,'#6dbd78',0);}
    if(t===4&&h<.3&&whp[i]>=70){c.fillStyle='#8d929c';c.beginPath();c.ellipse(cx+(h-.15)*14,cy+(h-.15)*6,3.4,2.3,0,0,7);c.fill();}
    if(t===4&&whp[i]<70){c.strokeStyle='#3a3d45';c.lineWidth=1.2;c.beginPath();c.moveTo(cx-4,cy-3);c.lineTo(cx,cy+1);c.lineTo(cx+4,cy-2);c.stroke();}
  }
  c.restore();
}

/* ---------- Spatial Hash ---------- */
function hidx(x,y){return clamp(y/HC|0,0,HH-1)*HW+clamp(x/HC|0,0,HW-1);}
function rebuildHash(){
  for(let i=0;i<hash.length;i++)hash[i].length=0;
  facCount.clear();totalAlive=0;
  for(const u of units){if(!u.alive)continue;hash[hidx(u.x,u.y)].push(u);const f=fac(u);facCount.set(f,(facCount.get(f)||0)+1);totalAlive++;}
}
function query(x,y,R,cb){
  const gx0=clamp((x-R)/HC|0,0,HW-1),gx1=clamp((x+R)/HC|0,0,HW-1),gy0=clamp((y-R)/HC|0,0,HH-1),gy1=clamp((y+R)/HC|0,0,HH-1);
  for(let gy=gy0;gy<=gy1;gy++)for(let gx=gx0;gx<=gx1;gx++){const cell=hash[gy*HW+gx];for(let i=0;i<cell.length;i++){const v=cell[i];if(v.alive&&cb(v)===true)return;}}
}
function nearestEnemy(u){
  const f=fac(u);if(totalAlive-(facCount.get(f)||0)<=0)return null;
  const cx=clamp(u.x/HC|0,0,HW-1),cy=clamp(u.y/HC|0,0,HH-1),maxR=Math.max(HW,HH);
  // Geister und Reiter jagen bevorzugt die hinteren Reihen; überall gilt: Ziele verteilen statt Schlange stehen
  const pref=u.type==='geist'?.45:u.type==='reiter'?.7:1,sq=Math.sqrt(pref);
  let best=null,bd=Infinity;
  for(let r=0;r<=maxR;r++){
    if(best&&(r-1)*HC*sq>Math.sqrt(bd))break;
    for(let gy=cy-r;gy<=cy+r;gy++){
      if(gy<0||gy>=HH)continue;const edge=(gy===cy-r||gy===cy+r);const stp=edge?1:Math.max(1,2*r);
      for(let gx=cx-r;gx<=cx+r;gx+=stp){
        if(gx<0||gx>=HW)continue;const cell=hash[gy*HW+gx];
        for(let i=0;i<cell.length;i++){const v=cell[i];if(!v.alive||fac(v)===f||(v.type==='heli'&&!u.T.fly&&u.T.range<20))continue;const dx=v.x-u.x,dy=v.y-u.y;
          let d=(dx*dx+dy*dy)*(1+.12*(v.tg===u?0:(v.att||0)));if(pref<1&&(v.T.heal||RANGED.has(v.type)))d*=pref;if(d<bd){bd=d;best=v;}}
      }
    }
  }
  return best;
}

/* ---------- Einheiten ---------- */
function spawn(type,x,y,team){
  const T=U[type];
  const u={id:nextId++,type,T,team,x,y,mx:0,my:0,kx:0,ky:0,hp:T.hp,cd:Math.random()*T.cd,rt:Math.random()*.3,tg:null,face:team==='rot'?-1:1,
    seed:Math.random()*10,alive:true,kills:0,run:0,blk:0,bcell:-1,hit:0,moving:false,gt:0,gn:1,gx:x,gy:y,att:0,st:0,wall:false};
  units.push(u);if(hash.length)hash[hidx(x,y)].push(u);
  return u;
}
function hurt(v,a,kind,src){
  if(!v.alive)return 0;
  let m=1;const t=v.type;
  if(t==='ritter'){m*=kind==='arrow'?.35:kind==='melee'?.7:kind==='bullet'?.8:1.5;if(v.wall&&(kind==='arrow'||kind==='melee'))m*=.65;}
  if(t==='panzer')m*=kind==='bullet'?.25:kind==='arrow'?.2:kind==='melee'?.7:kind==='rocket'?1.6:kind==='fire'?.6:.8;
  if(t==='heli')m*=kind==='rocket'?1.4:kind==='arrow'||kind==='melee'?.5:1;
  if(t==='geist'&&kind!=='fire')m*=.5;
  if(!v.T.fly&&terr[cIdx(v.x,v.y)]===3&&(kind==='arrow'||kind==='blast'||kind==='bullet'||kind==='rocket'))m*=.5;
  const d=a*m;v.hp-=d;v.hit=.12;
  if(v.hp<=0){die(v);if(src){src.kills++;if(mis&&src.team==='blau'&&src.kills>heroK){heroK=src.kills;heroType=src.type;}}}
  return d;
}
function decal(x,y,r,col,a){
  const k=zoom*dpr;dctx.setTransform(k,0,0,k,0,0);dctx.globalAlpha=a;dctx.fillStyle=col;
  for(let i=0;i<3;i++){dctx.beginPath();dctx.ellipse(x+rnd(-r,r)*.5,y+rnd(-r,r)*.3,r*rnd(.4,.8),r*rnd(.22,.42),0,0,7);dctx.fill();}
  dctx.globalAlpha=1;
}
function die(v){
  v.alive=false;dead++;
  decal(v.x,v.y+v.T.r*.7,v.T.r*1.1,shade(v.T.col,-.25),.13);
  if(mis){if(v.team==='blau')lostBlue++;else lostRed++;}
  for(let i=0;i<5;i++)parts.push({k:'dot',x:v.x,y:v.y,vx:rnd(-60,60),vy:rnd(-60,60),life:.5,max:.5,r:rnd(1.5,3.5),col:v.T.col});
  parts.push({k:'soul',x:v.x,y:v.y-v.T.r,vx:rnd(-8,8),vy:-28,life:1.3,max:1.3,r:Math.min(9,v.T.r*.7+2)});
  sfx('die');
}
function knock(v,nx,ny,f){if(v.type==='drache'||v.type==='panzer')f*=.15;else if(v.type==='baer'||v.type==='ritter')f*=.5;v.kx+=nx*f;v.ky+=ny*f;}
function blast(x,y,R,dmg,f,src,kind,wallMul){
  query(x,y,R+16,v=>{if(fac(v)===f)return;const dx=v.x-x,dy=v.y-y,d=Math.hypot(dx,dy);if(d>R+v.T.r)return;
    hurt(v,dmg*(1-.5*Math.min(1,d/R)),kind,src);knock(v,dx/(d||1),dy/(d||1),180);});
  if(wallMul){const g0x=(x-R)/CELL|0,g1x=(x+R)/CELL|0,g0y=(y-R)/CELL|0,g1y=(y+R)/CELL|0;
    for(let gy=Math.max(0,g0y);gy<=Math.min(GH-1,g1y);gy++)for(let gx=Math.max(0,g0x);gx<=Math.min(GW-1,g1x);gx++){
      const i=gy*GW+gx;if(terr[i]!==4)continue;const cx=gx*CELL+5,cy=gy*CELL+5;if((cx-x)**2+(cy-y)**2>R*R)continue;hitWall(i,dmg*wallMul,false);}
    drawTerrain(g0x-1,g0y-1,g1x+1,g1y+1);}
  const n=kind==='fire'?14:18;
  for(let i=0;i<n;i++){const a=Math.random()*6.283,s=rnd(30,170);parts.push({k:kind==='fire'?'fire':'boom',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.6),max:.6,r:rnd(3,7)});}
  parts.push({k:'ring',x,y,life:.35,max:.35,r:R});
  decal(x,y,R*.75,'#3a3d45',.07);
  shake=Math.max(shake,kind==='fire'?3:5);sfx(kind==='fire'?'fire':'boom');
}
function hitWall(i,d,redraw=true){
  whp[i]-=d;
  if(whp[i]<=0){terr[i]=0;towner[i]=0;const gx=i%GW,gy=i/GW|0,cx=gx*CELL+5,cy=gy*CELL+5;
    for(let k=0;k<3;k++)parts.push({k:'dot',x:cx,y:cy,vx:rnd(-50,50),vy:rnd(-50,50),life:.5,max:.5,r:rnd(1.5,3),col:'#8d929c'});}
  if(redraw){const gx=i%GW,gy=i/GW|0;drawTerrain(gx-1,gy-1,gx+1,gy+1);}
}
function shoot(u,t,kind,d){
  const T=u.T;let dur,h;
  const K={arrow:[.25,520,.16,8,'twang'],bomb:[.55,450,.35,14,'throw'],fire:[0,330,0,14,'fire'],bullet:[0,1100,0,5,'shot'],rocket:[0,520,0,6,'whoosh'],shell:[0,850,0,6,'cannon'],mortar:[.9,500,.55,18,'thump']}[kind];
  dur=K[0]+d/K[1];h=d*K[2];
  const px=t.x+t.mx*dur*.8,py=t.y+t.my*dur*.8,sp=K[3];
  const mx=u.x+u.face*T.r*(T.r>15?1.3:.9),my=u.y-T.r*(T.fly?.6:.3);
  proj.push({kind,x0:mx,y0:my,x1:px+rnd(-sp,sp),y1:py+rnd(-sp,sp),t:0,dur,h,f:fac(u),src:u,dmg:T.dmg,R:T.splash||0});
  if(kind==='bullet'||kind==='shell'||kind==='rocket')parts.push({k:'flash',x:mx+u.face*3,y:my,life:.07,max:.07,r:kind==='shell'?7:3.5});
  sfx(K[4]);
}
function breath(u,nx,ny){
  const T=u.T,f=fac(u);
  query(u.x,u.y,T.range+30,v=>{if(fac(v)===f)return;const dx=v.x-u.x,dy=v.y-u.y,d=Math.hypot(dx,dy);if(d>T.range+v.T.r)return;
    const dot=(dx*nx+dy*ny)/(d||1);if(dot<.82)return;hurt(v,T.dmg,'fire',u);});
  for(let i=0;i<4;i++){const a=Math.atan2(ny,nx)+rnd(-.5,.5),s=rnd(140,260);
    parts.push({k:'fire',x:u.x+nx*u.T.r,y:u.y-u.T.r*.6+ny*u.T.r,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(.3,.5),max:.5,r:rnd(3,6)});}
  sfx('fire');
}

const RANGED=new Set(['schuetze','grenadier','magier','soldat','mg','sniper','panzerfaust','moerser']);
const LINE=new Set(['krieger','ritter','soldat']);
const KITE=new Set(['schuetze','soldat','sniper']);
function groupInfo(u){
  const R=u.type==='wolf'?170:u.type==='biene'?60:70,f=fac(u);let cx=0,cy=0,n=0;
  query(u.x,u.y,R,v=>{if(v.type===u.type&&fac(v)===f){cx+=v.x;cy+=v.y;n++;}});
  u.gx=n?cx/n:u.x;u.gy=n?cy/n:u.y;u.gn=n;u.gt=.25+Math.random()*.1;
}
function toward(u,px,py){const x=px-u.x,y=py-u.y,l=Math.hypot(x,y)||1;return[x/l,y/l];}
function think(u,dt){
  const T=u.T;u.cd-=dt;u.rt-=dt;u.gt-=dt;if(u.hit>0)u.hit-=dt;if(u.st>0)u.st-=dt;u.mx=0;u.my=0;
  if(u.gt<=0)groupInfo(u);
  u.wall=u.type==='ritter'&&u.gn>=3;
  if(T.heal){healer(u,dt);return;}
  if(u.rt<=0||!u.tg||!u.tg.alive||fac(u.tg)===fac(u)){u.tg=nearestEnemy(u);u.rt=.35+Math.random()*.3;}
  const t=u.tg;
  if(!t)return;
  const dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy)||1,nx=dx/d,ny=dy/d;
  u.face=dx<0?-1:1;u.fx=nx;u.fy=ny;
  const reach=T.range+T.r+t.T.r;
  // Reiter reiten nach dem Sturmangriff durch die Reihen und wenden dann
  if(u.type==='reiter'&&u.st>0){u.mx=u.cvx;u.my=u.cvy;u.face=u.cvx<0?-1:1;return;}
  if(u.type==='moerser'&&d<90){u.mx=-nx*T.speed;u.my=-ny*T.speed;return;}
  if(d<=reach){
    attack(u,t,d,dx,dy);
    if(KITE.has(u.type)&&u.cd>.3&&d<T.range*.35&&t.T.range<20&&!t.T.fly){u.mx=-nx*T.speed*.5;u.my=-ny*T.speed*.5;}
    else if(u.type==='drache'||u.type==='heli'){const s=u.id%2?1:-1;u.mx=-ny*s*T.speed*.5;u.my=nx*s*T.speed*.5;}
    return;
  }
  if(!T.fly&&u.blk>.45&&terr[u.bcell]===4){if(u.cd<=0){u.cd=T.cd;hitWall(u.bcell,(T.dmg||8)*(T.splash?2.5:1.3));sfx('hit');}return;}
  let a=[nx,ny],sp=T.speed;
  switch(u.type){
    case'wolf':
      // Rudel: fächert sich um die Beute auf und greift von den Seiten und von hinten an
      if(u.gn>=3&&d>40){const base=Math.atan2(u.gy-t.y,u.gx-t.x)+((u.id%5)-2)*.55,R=Math.max(8,d*.45);a=toward(u,t.x+Math.cos(base)*R,t.y+Math.sin(base)*R);}
      break;
    case'reiter':
      // Flankenritt: erst seitlich am Ziel vorbei, dann Sturmangriff
      if(d>140){const s=u.id%2?1:-1,R=Math.min(130,d*.5);a=toward(u,t.x-ny*s*R,t.y+nx*s*R);}
      break;
    case'biene':{
      // Schwarm: kreist ums Ziel, bleibt zusammen, schwirrt
      const s=u.id%2?1:-1,o=d<60?.45:.3;let ax=nx-ny*s*o+(u.gx-u.x)*.01+rnd(-.5,.5),ay=ny+nx*s*o+(u.gy-u.y)*.01+rnd(-.5,.5);const l=Math.hypot(ax,ay)||1;a=[ax/l,ay/l];break;}
    case'krieger':case'ritter':case'geist':case'baer':
      // Einkreisen: ist das Ziel schon umringt, sucht man sich einen freien Platz drumherum
      if(t.att>3&&d<130){const g=Math.atan2(u.y-t.y,u.x-t.x)+((u.id%3)-1)*.6,R=reach*.9;a=toward(u,t.x+Math.cos(g)*R,t.y+Math.sin(g)*R);}
      break;
  }
  // Reihe halten: wer vor der Gruppe läuft, wartet; wer hinterherhängt, schließt auf
  if(LINE.has(u.type)&&u.gn>=3&&d>reach+20){const depth=(u.x-u.gx)*nx+(u.y-u.gy)*ny;sp*=clamp(1-depth/45,.35,1.3);}
  u.mx=a[0]*sp;u.my=a[1]*sp;
  u.run+=dt;
}
function attack(u,t,d,dx,dy){
  const T=u.T;if(u.cd>0)return;u.cd=T.cd*(.85+Math.random()*.3);
  switch(u.type){
    case'schuetze':shoot(u,t,'arrow',d);break;
    case'grenadier':shoot(u,t,'bomb',d);break;
    case'magier':shoot(u,t,'fire',d);break;
    case'soldat':case'mg':case'sniper':case'heli':shoot(u,t,'bullet',d);break;
    case'panzerfaust':shoot(u,t,'rocket',d);break;
    case'panzer':shoot(u,t,'shell',d);shake=Math.max(shake,2);break;
    case'moerser':shoot(u,t,'mortar',d);break;
    case'drache':breath(u,dx/d,dy/d);break;
    case'baer':{const f=fac(u);query(t.x,t.y,T.splash+20,v=>{if(fac(v)===f)return;const ex=v.x-t.x,ey=v.y-t.y;if(ex*ex+ey*ey>(T.splash+v.T.r)**2)return;hurt(v,T.dmg*(.85+Math.random()*.3),'melee',u);knock(v,dx/d,dy/d,140);});
      shake=Math.max(shake,2);sfx('thud');break;}
    default:{
      let a=T.dmg*(.85+Math.random()*.3);
      if(t.fx!==undefined&&((u.x-t.x)*t.fx+(u.y-t.y)*t.fy)/d<-.3){a*=1.35;parts.push({k:'dot',x:t.x,y:t.y-t.T.r,vx:rnd(-20,20),vy:-40,life:.35,max:.35,r:2.6,col:'#ffb800'});}
      if(u.type==='reiter'&&u.run>.7){a*=2.6;knock(t,dx/d,dy/d,260);parts.push({k:'ring',x:t.x,y:t.y,life:.25,max:.25,r:16});u.st=.6;u.cvx=dx/d*T.speed;u.cvy=dy/d*T.speed;}
      if(u.type==='wolf'){let n=0;query(u.x,u.y,70,v=>{if(v.type==='wolf'&&v.team===u.team&&++n>=3)return true;});if(n>=3)a*=1.4;}
      const dealt=hurt(t,a,'melee',u);
      if(u.type==='geist')u.hp=Math.min(T.hp,u.hp+dealt);
      sfx(u.type==='krieger'||u.type==='ritter'?'clink':'hit');
    }
  }
  u.run=0;
}
function healer(u,dt){
  const T=u.T,f=fac(u);
  if(u.rt<=0||!u.tg||!u.tg.alive||u.tg.hp>=u.tg.T.hp||fac(u.tg)!==f){
    let best=null,bd=Infinity;
    query(u.x,u.y,380,v=>{if(v===u||fac(v)!==f||v.hp>=v.T.hp||v.T.heal)return;const d=(v.x-u.x)**2+(v.y-u.y)**2;if(d<bd){bd=d;best=v;}});
    if(!best){query(u.x,u.y,420,v=>{if(v===u||fac(v)!==f||v.T.heal)return;const d=(v.x-u.x)**2+(v.y-u.y)**2;if(d<bd){bd=d;best=v;}});u.follow=true;}else u.follow=false;
    u.tg=best;u.rt=.4+Math.random()*.2;
  }
  // Sanitäter halten sich aus dem Getümmel heraus
  let ex=0,ey=0;query(u.x,u.y,110,v=>{if(fac(v)===f)return;const qx=u.x-v.x,qy=u.y-v.y,q=Math.hypot(qx,qy)||1;ex+=qx/q;ey+=qy/q;});
  if(ex||ey){const l=Math.hypot(ex,ey);u.mx=ex/l*T.speed;u.my=ey/l*T.speed;u.face=ex<0?-1:1;return;}
  const t=u.tg;if(!t)return;
  const dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy)||1;u.face=dx<0?-1:1;
  const want=u.follow?55:T.range*.6;
  if(d>want){u.mx=dx/d*T.speed;u.my=dy/d*T.speed;}
  if(!u.follow&&d<=T.range&&u.cd<=0){
    u.cd=T.cd;
    query(t.x,t.y,50,v=>{if(fac(v)!==f||v.hp>=v.T.hp)return;v.hp=Math.min(v.T.hp,v.hp+T.heal);parts.push({k:'plus',x:v.x+rnd(-4,4),y:v.y-v.T.r,vx:0,vy:-30,life:.7,max:.7,r:5});});
  }
}
function move(u,dt){
  const T=u.T;let sp=1;const ci=cIdx(u.x,u.y),tt=T.fly?0:terr[ci];
  if(tt===1)sp=.4;else if(tt===2){sp=.8;hurt(u,10*dt,'fire',null);if(Math.random()<dt*6)parts.push({k:'fire',x:u.x+rnd(-4,4),y:u.y,vx:0,vy:-40,life:.4,max:.4,r:3});}else if(tt===3)sp=.85;
  if(!u.alive)return;
  const vx=u.mx*sp+u.kx,vy=u.my*sp+u.ky;u.kx*=.88;u.ky*=.88;
  let nx=u.x+vx*dt,ny=u.y+vy*dt,blocked=false;
  if(!T.fly&&tt!==4){
    const lx=nx+Math.sign(vx)*T.r*.6;const a=cIdx(lx,u.y);if(terr[a]===4){nx=u.x;blocked=true;u.bcell=a;u.kx=0;}
    const ly=ny+Math.sign(vy)*T.r*.6;const b=cIdx(nx,ly);if(terr[b]===4){ny=u.y;blocked=true;u.bcell=b;u.ky=0;}
  }
  u.blk=blocked?u.blk+dt:Math.max(0,u.blk-dt*2);
  u.x=clamp(nx,6,W-6);u.y=clamp(ny,6,H-6);
  u.moving=Math.abs(vx)+Math.abs(vy)>6;
}
function separate(){
  for(const u of units){
    if(!u.alive)continue;const ru=u.T.r,fu=!!u.T.fly;
    const gx=clamp(u.x/HC|0,0,HW-1),gy=clamp(u.y/HC|0,0,HH-1);
    for(let yy=Math.max(0,gy-1);yy<=Math.min(HH-1,gy+1);yy++)for(let xx=Math.max(0,gx-1);xx<=Math.min(HW-1,gx+1);xx++){
      const cell=hash[yy*HW+xx];
      for(let i=0;i<cell.length;i++){const v=cell[i];if(v===u||!v.alive||!!v.T.fly!==fu)continue;
        const rr=(ru+v.T.r)*.92,dx=u.x-v.x,dy=u.y-v.y,d2=dx*dx+dy*dy;
        if(d2<rr*rr){const d=Math.sqrt(d2)||.01,ov=(rr-d)/d,w=v.T.r/(ru+v.T.r);u.x+=dx*ov*.5*w;u.y+=dy*ov*.5*w;}}
    }
  }
}
function updateProj(dt){
  for(let i=proj.length-1;i>=0;i--){
    const p=proj[i];p.t+=dt;
    if(p.kind==='fire'&&Math.random()<.5)parts.push({k:'fire',x:p.x0+(p.x1-p.x0)*p.t/p.dur,y:p.y0+(p.y1-p.y0)*p.t/p.dur,vx:rnd(-15,15),vy:rnd(-15,15),life:.25,max:.25,r:rnd(2,4)});
    if(p.kind==='rocket'&&Math.random()<.6)parts.push({k:'smoke',x:p.x0+(p.x1-p.x0)*p.t/p.dur,y:p.y0+(p.y1-p.y0)*p.t/p.dur,vx:rnd(-8,8),vy:rnd(-8,8),life:.5,max:.5,r:rnd(2,3.5)});
    if(p.t<p.dur)continue;
    proj.splice(i,1);
    if(p.kind==='arrow'||p.kind==='bullet'){
      let best=null,bd=Infinity;query(p.x1,p.y1,26,v=>{if(fac(v)===p.f)return;const d=Math.hypot(v.x-p.x1,v.y-p.y1)-v.T.r;if(d<8&&d<bd){bd=d;best=v;}});
      if(best){hurt(best,p.dmg*(.85+Math.random()*.3),p.kind,p.src.alive?p.src:null);sfx('hit');}
      else if(p.kind==='arrow')parts.push({k:'arrow',x:p.x1,y:p.y1,a:Math.atan2(p.y1-p.y0,p.x1-p.x0),life:2.5,max:2.5,r:0});
      else parts.push({k:'dot',x:p.x1,y:p.y1,vx:rnd(-20,20),vy:rnd(-20,20),life:.25,max:.25,r:1.5,col:'#b8a98a'});
    }else blast(p.x1,p.y1,p.R,p.dmg,p.f,p.src.alive?p.src:null,p.kind==='fire'?'fire':p.kind==='rocket'?'rocket':'blast',p.kind==='fire'?1.5:p.kind==='rocket'?2:3);
  }
}
function step(dt){
  simT+=dt;
  rebuildHash();
  for(const u of units)u.att=0;
  for(const u of units)if(u.alive&&u.tg&&u.tg.alive)u.tg.att++;
  for(const u of units)if(u.alive)think(u,dt);
  for(const u of units)if(u.alive)move(u,dt);
  separate();
  updateProj(dt);
  if(dead>300){units=units.filter(u=>u.alive);dead=0;}
  if(mis){if(misPhase==='battle'){misT+=dt;checkMission();}}
  else checkWinner();
}

/* ---------- Partikel ---------- */
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue;}
    if(p.vx!==undefined){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k!=='soul'&&p.k!=='plus'){p.vx*=.9;p.vy*=.9;}}}
  if(parts.length>1400)parts.splice(0,parts.length-1400);
}
function drawParts(c){
  for(const p of parts){const a=p.life/p.max;
    switch(p.k){
      case'dot':c.globalAlpha=a;c.fillStyle=p.col;c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();break;
      case'boom':c.globalAlpha=a;c.fillStyle=a>.55?'#ffd84d':a>.3?'#ff8a3d':'#9aa0aa';c.beginPath();c.arc(p.x,p.y,p.r*(1.6-a*.6),0,7);c.fill();break;
      case'fire':c.globalAlpha=a;c.fillStyle=a>.6?'#ffe066':a>.3?'#ff8a3d':'#e5574f';c.beginPath();c.arc(p.x,p.y,p.r*(.6+a*.6),0,7);c.fill();break;
      case'ring':c.globalAlpha=a*.8;c.strokeStyle=O;c.lineWidth=2;c.beginPath();c.arc(p.x,p.y,p.r*(1.15-a*.5),0,7);c.stroke();break;
      case'plus':c.globalAlpha=a;c.fillStyle='#2fbf6b';c.fillRect(p.x-1.5,p.y-5,3,10);c.fillRect(p.x-5,p.y-1.5,10,3);break;
      case'arrow':c.globalAlpha=Math.min(1,a*2);c.strokeStyle='#8a5a2b';c.lineWidth=1.4;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-Math.cos(p.a)*8,p.y-Math.sin(p.a)*8);c.stroke();break;
      case'smoke':c.globalAlpha=a*.5;c.fillStyle='#9aa0aa';c.beginPath();c.arc(p.x,p.y,p.r*(2-a),0,7);c.fill();break;
      case'flash':c.globalAlpha=a;c.fillStyle='#ffe066';c.beginPath();c.arc(p.x,p.y,p.r,0,7);c.fill();break;
      case'soul':{c.globalAlpha=a*.85;const r=p.r,x=p.x+Math.sin(p.life*6)*2,y=p.y;
        c.beginPath();c.moveTo(x-r,y+r*.6);c.arc(x,y,r,Math.PI,0);c.lineTo(x+r,y+r*.6);c.lineTo(x+r*.35,y+r*.35);c.lineTo(x,y+r*.7);c.lineTo(x-r*.35,y+r*.35);c.closePath();
        c.fillStyle='#fff';c.fill();c.strokeStyle='#9aa6b8';c.lineWidth=1.2;c.stroke();
        c.fillStyle=O;c.fillRect(x-r*.35,y-r*.2,r*.18,r*.3);c.fillRect(x+r*.17,y-r*.2,r*.18,r*.3);break;}
    }
  }
  c.globalAlpha=1;
}

/* ---------- Malen ---------- */
function canPaintAt(x){return !(mis&&(misPhase!=='plan'||x>W*.42));}
function stamp(x,y){
  rebuildHash();
  const R=brush;
  if(TER[sel]){paintTerrain(x,y,R,sel);return;}
  const T=U[sel],r=T.r,minD=r*2.05;
  if(units.length-dead>2600){warn('Das Schlachtfeld ist voll.');return;}
  const tries=Math.min(140,Math.ceil((R*R)/((minD*.9)**2)*1.4)+1);
  let placed=0;
  for(let i=0;i<tries;i++){
    const a=Math.random()*6.283,d=Math.sqrt(Math.random())*R,px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;
    if(px<r||py<r||px>W-r||py>H-r)continue;
    if(!canPaintAt(px))continue;
    if(!T.fly&&terr[cIdx(px,py)]===4)continue;
    let ok=true;query(px,py,minD+26,v=>{if(!!v.T.fly!==!!T.fly&&!(sel==='geist'))return;const rr=Math.max(minD,(r+v.T.r)*1.02);if((v.x-px)**2+(v.y-py)**2<rr*rr){ok=false;return true;}});
    if(!ok)continue;
    if(mis){if(spent+T.cost>mis.budget+1e-6){warn('Budget aufgebraucht.');break;}spent+=T.cost;}
    const nu=spawn(sel,px,py,mis?'blau':curTeam);placed++;if(stroke)stroke.units.push(nu);
  }
  if(placed){sfx('pop');updateMisUI();}
}
function paintTerrain(x,y,R,key){
  const id=TER[key].id,cost=TER[key].cost;
  const g0x=Math.floor((x-R)/CELL),g1x=Math.floor((x+R)/CELL),g0y=Math.floor((y-R)/CELL),g1y=Math.floor((y+R)/CELL);
  let changed=false,broke=false;
  for(let gy=Math.max(0,g0y);gy<=Math.min(GH-1,g1y);gy++)for(let gx=Math.max(0,g0x);gx<=Math.min(GW-1,g1x);gx++){
    const cx=gx*CELL+5,cy=gy*CELL+5;if((cx-x)**2+(cy-y)**2>R*R)continue;
    if(!canPaintAt(cx))continue;
    const i=gy*GW+gx,old=terr[i];
    if(mis){
      if(old&&!towner[i])continue;
      if(old===id)continue;
      if(old){const k=Object.keys(TER).find(n=>TER[n].id===old);spent=Math.max(0,spent-TER[k].cost);}
      if(id){if(spent+cost>mis.budget+1e-6){broke=true;continue;}spent+=cost;}
    }
    if(old===id&&id!==4)continue;
    if(stroke&&!stroke.cells.has(i))stroke.cells.set(i,[old,towner[i],whp[i]]);
    terr[i]=id;towner[i]=mis&&id?1:0;whp[i]=id===4?140:0;changed=true;
  }
  if(key==='radierer'){
    query(x,y,R+10,v=>{if((v.x-x)**2+(v.y-y)**2>R*R)return;if(mis&&v.team!=='blau')return;if(mis)spent=Math.max(0,spent-v.T.cost);
      if(stroke)stroke.erased.push({type:v.type,team:v.team,x:v.x,y:v.y,hp:v.hp});v.alive=false;dead++;changed=true;});
  }
  if(broke)warn('Budget aufgebraucht.');
  if(changed){drawTerrain(g0x-1,g0y-1,g1x+1,g1y+1);updateMisUI();}
}

/* ---------- Eingabe ---------- */
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
cv.addEventListener('pointerdown',e=>{
  audioInit();closeBanner();
  const p=toWorld(e);
  if(mis&&misPhase!=='plan'){toast(misPhase==='battle'?'Während des Kampfes wird nicht gemalt.':'Plane neu, um weiter zu malen.');return;}
  if(mis&&p.x>W*.42){toast('Male nur links der gestrichelten Linie.');return;}
  cv.setPointerCapture(e.pointerId);
  stroke={units:[],cells:new Map(),erased:[],spent,warned:false};
  pointer.down=true;pointer.btn=e.button;pointer.lx=p.x;pointer.ly=p.y;pointer.dist=0;
  const prev=sel;if(e.button===2)sel='radierer';
  stamp(p.x,p.y);sel=prev;
});
cv.addEventListener('pointermove',e=>{
  const p=toWorld(e);pointer.x=p.x;pointer.y=p.y;pointer.inside=true;
  if(!pointer.down)return;
  const dx=p.x-pointer.lx,dy=p.y-pointer.ly,d=Math.hypot(dx,dy),gap=Math.max(6,brush*.45);
  if(d<gap)return;
  const n=Math.floor(d/gap),prev=sel;if(pointer.btn===2)sel='radierer';
  for(let i=1;i<=n;i++)stamp(pointer.lx+dx*i/n,pointer.ly+dy*i/n);
  sel=prev;pointer.lx=p.x;pointer.ly=p.y;
});
const up=()=>{
  pointer.down=false;
  if(stroke&&(stroke.units.length||stroke.cells.size||stroke.erased.length)){undoStack.push(stroke);if(undoStack.length>40)undoStack.shift();}
  stroke=null;
};
function warn(msg){if(stroke){if(stroke.warned)return;stroke.warned=true;}toast(msg);}
function undo(){
  if(mis&&misPhase!=='plan')return;
  const s=undoStack.pop();if(!s){toast('Nichts zum Rückgängigmachen.');return;}
  for(const u of s.units)if(u.alive){u.alive=false;dead++;}
  let x0=1e9,y0=1e9,x1=-1,y1=-1;
  for(const[i,[t,o,h]]of s.cells){if(i>=terr.length)continue;terr[i]=t;towner[i]=o;whp[i]=h;const gx=i%GW,gy=i/GW|0;x0=Math.min(x0,gx);y0=Math.min(y0,gy);x1=Math.max(x1,gx);y1=Math.max(y1,gy);}
  if(x1>=0)drawTerrain(x0-1,y0-1,x1+1,y1+1);
  for(const e of s.erased){const n=spawn(e.type,e.x,e.y,e.team);n.hp=e.hp;}
  if(mis)spent=s.spent;
  rebuildHash();updateMisUI();updateCounts();
}
function catKeys(c){return c==='gelaende'?Object.keys(TER):Object.keys(U).filter(k=>U[k].cat===c);}
function catAllowed(c){return !(mis&&mis.cats&&!mis.cats.includes(c));}
function setCat(c){if(!catAllowed(c))return;cat=c;if(!catKeys(c).includes(sel))sel=catKeys(c)[0];renderUnits();}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{pointer.inside=false;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();brush=clamp(brush-Math.sign(e.deltaY)*6,10,150);$('brush').value=brush;},{passive:false});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type!=='range')return;
  if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();togglePause();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='q'||k==='e'){const order=CATS.map(c=>c[0]).filter(catAllowed);let i=order.indexOf(cat);if(i<0)i=0;setCat(order[(i+(k==='e'?1:order.length-1))%order.length]);}
  else if(/^[1-9]$/.test(k)){const t=catKeys(cat)[+k-1];if(t){sel=t;renderUnits();}}
  else if(k==='x'&&catAllowed('gelaende')){cat='gelaende';sel='radierer';renderUnits();}
});

/* ---------- Ton ---------- */
let AC=null,noiseB=null;const lastS={};let sCount=0,sWin=0;
function audioInit(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();const n=AC.sampleRate*.5;noiseB=AC.createBuffer(1,n,AC.sampleRate);const d=noiseB.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
}
function sfx(k){
  if(save.muted||!AC||AC.state!=='running')return;
  const now=AC.currentTime;if(lastS[k]&&now-lastS[k]<.06)return;lastS[k]=now;
  if(now-sWin>.1){sWin=now;sCount=0;}if(++sCount>6)return;
  const g=AC.createGain();g.connect(AC.destination);
  const tone=(type,f0,f1,dur,vol)=>{const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,now);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),now+dur);
    g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);o.connect(g);o.start(now);o.stop(now+dur+.02);};
  const noise=(ft,fq,dur,vol)=>{const s=AC.createBufferSource();s.buffer=noiseB;const f=AC.createBiquadFilter();f.type=ft;f.frequency.value=fq;s.connect(f);f.connect(g);
    g.gain.setValueAtTime(vol,now);g.gain.exponentialRampToValueAtTime(.0001,now+dur);s.start(now,Math.random()*.3);s.stop(now+dur+.02);};
  switch(k){
    case'pop':tone('sine',420,820,.08,.07);break;
    case'clink':noise('bandpass',3200,.05,.06);break;
    case'hit':noise('bandpass',1300,.06,.07);break;
    case'thud':tone('sine',140,60,.15,.15);break;
    case'twang':tone('triangle',520,240,.09,.05);break;
    case'throw':tone('sine',300,600,.12,.04);break;
    case'boom':noise('lowpass',500,.45,.22);break;
    case'fire':noise('bandpass',700,.18,.05);break;
    case'shot':noise('highpass',2200,.05,.05);break;
    case'cannon':noise('lowpass',350,.4,.22);break;
    case'whoosh':noise('bandpass',900,.3,.06);break;
    case'thump':tone('sine',180,70,.18,.12);break;
    case'die':tone('sine',380,140,.12,.04);break;
    case'win':[523,659,784,1046].forEach((f,i)=>{const o=AC.createOscillator(),gg=AC.createGain();o.type='triangle';o.frequency.value=f;gg.gain.setValueAtTime(.0001,now+i*.11);gg.gain.exponentialRampToValueAtTime(.09,now+i*.11+.02);gg.gain.exponentialRampToValueAtTime(.0001,now+i*.11+.3);o.connect(gg);gg.connect(AC.destination);o.start(now+i*.11);o.stop(now+i*.11+.32);});break;
    case'lose':tone('triangle',330,110,.6,.08);break;
  }
}

/* ---------- Rendern ---------- */
let lastFrame=performance.now(),uiT=0;
function frame(now){
  const realDt=Math.min(.05,(now-lastFrame)/1000);lastFrame=now;
  const ts=(slow?.3:1)*speed*(endT>=0?.35:1);
  if(!paused&&!(mis&&misPhase==='plan')){
    acc+=realDt*ts;let n=0;while(acc>=STEP&&n<6){step(STEP);acc-=STEP;n++;}if(n>=6)acc=0;
    updateParts(realDt*ts);
  }else updateParts(realDt*.5);
  if(endT>=0){endT-=realDt;if(endT<0)showResult();}
  shake*=.85;
  render(now/1000);
  uiT-=realDt;if(uiT<=0){uiT=.25;updateCounts();}
  requestAnimationFrame(frame);
}
function render(t){
  const k=zoom*dpr;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
  const sx=RM?0:(Math.random()-.5)*shake,sy=RM?0:(Math.random()-.5)*shake;
  ctx.setTransform(k,0,0,k,sx*k,sy*k);
  if(mis&&misPhase==='plan'){
    const zx=W*.42;ctx.fillStyle='rgba(77,130,240,.05)';ctx.fillRect(0,0,zx,H);
    ctx.setLineDash([10,10]);ctx.strokeStyle='rgba(77,130,240,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(zx,0);ctx.lineTo(zx,H);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle='rgba(77,130,240,.8)';ctx.font='800 15px Nunito, system-ui, sans-serif';ctx.textAlign='right';ctx.fillText('deine Seite',zx-10,H*.5+5);ctx.textAlign='left';
  }
  ctx.drawImage(tcv,0,0,W,H);
  ctx.drawImage(dcv,0,0,W,H);
  // Einheiten
  const list=[];let top=null;for(const u of units)if(u.alive){list.push(u);if(u.kills>=3&&(!top||u.kills>top.kills))top=u;}
  list.sort((a,b)=>(a.T.fly?1e5:0)+a.y-((b.T.fly?1e5:0)+b.y));
  const tm=teamMode;
  // Schildwall: verbundene Schilde sichtbar machen
  ctx.lineWidth=3;ctx.lineCap='round';ctx.globalAlpha=.5;
  for(const u of list){
    if(!u.wall)continue;const f=fac(u);let b=null,bd=42*42;
    query(u.x,u.y,42,v=>{if(v.id<=u.id||!v.wall||fac(v)!==f)return;const e=(v.x-u.x)**2+(v.y-u.y)**2;if(e<bd){bd=e;b=v;}});
    if(b){ctx.strokeStyle=tm?TEAMS[u.team].c:'#6f7a8c';ctx.beginPath();ctx.moveTo(u.x+u.face*u.T.r*.8,u.y);ctx.lineTo(b.x+b.face*b.T.r*.8,b.y);ctx.stroke();}
  }
  ctx.globalAlpha=1;
  for(const u of list){
    const frame=u.moving||u.T.fly?((t*(u.T.fly?10:7)+u.seed)|0)%2:0;
    const s=getSprite(u.type,tm?u.team:null,u.face<0,frame),S=spriteSize(u.T.r);
    if(u.hit>0)ctx.globalAlpha=.55;
    ctx.drawImage(s,u.x-S/2,u.y-S/2,S,S);
    ctx.globalAlpha=1;
    if(u.hp<u.T.hp&&u.T.hp>10){const w=Math.max(12,u.T.r*1.6),y=u.y-u.T.r*(u.T.fly?2.1:1.6)-4;
      ctx.fillStyle='rgba(42,42,51,.25)';ctx.fillRect(u.x-w/2,y,w,3);ctx.fillStyle=u.hp/u.T.hp>.4?'#2fbf6b':'#e5574f';ctx.fillRect(u.x-w/2,y,w*Math.max(0,u.hp/u.T.hp),3);}
  }
  if(top){
    const x=top.x,y=top.y-top.T.r*(top.T.fly?2.3:1.75)-14;
    ctx.fillStyle='#ffc533';ctx.strokeStyle=O;ctx.lineWidth=1.3;ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(x-7,y+5);ctx.lineTo(x-8.5,y-4);ctx.lineTo(x-3.5,y);ctx.lineTo(x,y-6);ctx.lineTo(x+3.5,y);ctx.lineTo(x+8.5,y-4);ctx.lineTo(x+7,y+5);ctx.closePath();ctx.fill();ctx.stroke();
    ctx.font='800 11px Nunito, system-ui, sans-serif';ctx.textAlign='left';ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.strokeText(top.kills,x+11,y+5);ctx.fillStyle=O;ctx.fillText(top.kills,x+11,y+5);
  }
  // Geschosse
  for(const p of proj){
    const q=p.t/p.dur,x=p.x0+(p.x1-p.x0)*q,y=p.y0+(p.y1-p.y0)*q-Math.sin(q*Math.PI)*p.h;
    if(p.kind==='arrow'){const q2=Math.min(1,q+.04),x2=p.x0+(p.x1-p.x0)*q2,y2=p.y0+(p.y1-p.y0)*q2-Math.sin(q2*Math.PI)*p.h,a=Math.atan2(y2-y,x2-x);
      ctx.strokeStyle='#8a5a2b';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-Math.cos(a)*5,y-Math.sin(a)*5);ctx.lineTo(x+Math.cos(a)*5,y+Math.sin(a)*5);ctx.stroke();}
    else if(p.kind==='bomb'||p.kind==='mortar'){E(ctx,x,y,4,4,'#2f3340',1);if(p.kind==='bomb')E(ctx,x+2,y-4,1.6,1.6,'#ffb800',0);}
    else if(p.kind==='bullet'){const a=Math.atan2(p.y1-p.y0,p.x1-p.x0);ctx.strokeStyle='#e0a020';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(x-Math.cos(a)*7,y-Math.sin(a)*7);ctx.lineTo(x+Math.cos(a)*3,y+Math.sin(a)*3);ctx.stroke();}
    else if(p.kind==='rocket'){const a=Math.atan2(p.y1-p.y0,p.x1-p.x0);E(ctx,x-Math.cos(a)*6,y-Math.sin(a)*6,3,3,'#ff8a3d',0);ctx.strokeStyle=O;ctx.lineWidth=3.4;ctx.beginPath();ctx.moveTo(x-Math.cos(a)*4,y-Math.sin(a)*4);ctx.lineTo(x+Math.cos(a)*4,y+Math.sin(a)*4);ctx.stroke();}
    else if(p.kind==='shell'){E(ctx,x,y,3.2,3.2,'#2f3340',0);}
    else{E(ctx,x,y,6,6,'#ff8a3d',0);E(ctx,x,y,3.5,3.5,'#ffe066',0);}
  }
  drawParts(ctx);
  // Pinsel
  if(pointer.inside&&!(mis&&misPhase!=='plan')){
    const er=sel==='radierer'||pointer.btn===2&&pointer.down;
    ctx.fillStyle=er?'rgba(255,120,150,.10)':'rgba(77,130,240,.07)';ctx.strokeStyle=er?'#ff6f91':'#4d82f0';ctx.lineWidth=1.6;
    ctx.beginPath();ctx.arc(pointer.x,pointer.y,brush,0,7);ctx.fill();ctx.stroke();
  }
}

function placeRect(type,n,x0,y0,x1,y1,team){
  const X0=x0*W,Y0=y0*H,w=(x1-x0)*W,h=(y1-y0)*H;
  const cols=Math.max(1,Math.round(Math.sqrt(n*w/Math.max(1,h)))),rows=Math.ceil(n/cols);let k=0;
  for(let j=0;j<rows;j++)for(let i=0;i<cols&&k<n;i++,k++)spawn(type,X0+(cols===1?w/2:i*w/(cols-1))+rnd(-2,2),Y0+(rows===1?h/2:j*h/(rows-1))+rnd(-2,2),team);
}
function placeCircle(type,n,cx,cy,rr,team){for(let k=0;k<n;k++){const a=k*2.39996,d=Math.sqrt((k+.5)/n)*rr*H;spawn(type,cx*W+Math.cos(a)*d,cy*H+Math.sin(a)*d,team);}}
function tRect(key,x0,y0,x1,y1){const id=TER[key].id;for(let gy=Math.floor(y0*H/CELL);gy<=Math.floor(y1*H/CELL);gy++)for(let gx=Math.floor(x0*W/CELL);gx<=Math.floor(x1*W/CELL);gx++){if(gx<0||gy<0||gx>=GW||gy>=GH)continue;const i=gy*GW+gx;terr[i]=id;towner[i]=0;whp[i]=140;}}
function tCircle(key,cx,cy,rr,inner=0){const id=TER[key].id,X=cx*W,Y=cy*H,R=rr*H,Ri=inner*H;
  for(let gy=0;gy<GH;gy++)for(let gx=0;gx<GW;gx++){const d=Math.hypot(gx*CELL+5-X,gy*CELL+5-Y);if(d<=R&&d>=Ri){const i=gy*GW+gx;terr[i]=id;towner[i]=0;whp[i]=140;}}}

    <li><span>Eigene Verluste</span>${lostBlue}</li><li><span>Besiegte Gegner</span>${lostRed}</li>
    <li><span>Kampfdauer</span>${Math.round(misT)} s</li>
    ${heroType?`<li><span>Held der Schlacht</span>${U[heroType].n} mit ${heroK} Siegen</li>`:''}`;
  $('resNext').hidden=!(win&&misIdx<MIS.length-1);
  $('resRetry').textContent=win?'Besser planen':'Nochmal planen';
  $('ovRes').hidden=false;sfx(win?'win':'lose');
}
function enterSandbox(){
  $('ovList').hidden=true;$('ovRes').hidden=true;
  if(!mis){return;}
  mis=null;misPhase=null;snap=null;endT=-1;
  $('mSand').classList.add('on');$('mMis').classList.remove('on');$('misBar').hidden=true;$('teamBox').hidden=false;$('bDice').hidden=false;
  clearAll();
  if(sandSave){teamMode=sandSave.teamMode;setTerrain(sandSave.t,GW,GH);for(const u of sandSave.units){const n=spawn(u.type,clamp(u.x,6,W-6),clamp(u.y,6,H-6),u.team);n.hp=u.hp;}drawTerrain(0,0,GW-1,GH-1);}
  else seedDemo();
  $('teamToggle').checked=teamMode;$('chips').hidden=!teamMode;
  rebuildHash();renderUnits();
}

/* ---------- Start ---------- */
let started=false;
function boot(){
  if(started)return;const r=cv.getBoundingClientRect();if(r.width<50||r.height<50)return;
  started=true;resize();seedDemo();rebuildHash();updateCounts();requestAnimationFrame(frame);
}
new ResizeObserver(()=>{if(started)resize();else boot();}).observe(cv);
buildPalette();buildChips();setMuteIcon();
requestAnimationFrame(boot);
})();
</script>
